<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Globo D3</title>
  <style>
    body { background: #F7F4EB; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    canvas { width: 600px; height: 600px; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="c" width="1200" height="1200"></canvas>
  <script src="d3.min.js"></script>
  <script>
    fetch('ne_land_110m_compact.json')
      .then(r => r.json())
      .then(land => {
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const width = canvas.width, height = canvas.height;
        let rotate = [0, -25, 0];
        let scale = width * 0.45;

        const projection = d3.geoOrthographic()
          .scale(scale)
          .translate([width / 2, height / 2])
          .rotate(rotate)
          .clipAngle(90);

        const path = d3.geoPath(projection, ctx);
        const graticule = d3.geoGraticule10();

        function render() {
          ctx.clearRect(0, 0, width, height);

          // Ocean
          ctx.save();
          ctx.beginPath();
          path({type: 'Sphere'});
          const oceanGrad = ctx.createRadialGradient(width * 0.42, height * 0.38, scale * 0.05, width / 2, height / 2, scale * 1.15);
          oceanGrad.addColorStop(0, '#F5F0E4');
          oceanGrad.addColorStop(1, '#D8CEBD');
          ctx.fillStyle = oceanGrad;
          ctx.fill();

          // Graticule
          ctx.beginPath();
          path(graticule);
          ctx.strokeStyle = '#D0C3AF';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Land
          ctx.beginPath();
          path(land);
          ctx.fillStyle = '#9AAF8F';
          ctx.fill();
          ctx.strokeStyle = '#6E8564';
          ctx.lineWidth = 1.8;
          ctx.stroke();

          // Sphere outline
          ctx.beginPath();
          path({type: 'Sphere'});
          ctx.strokeStyle = '#63775A';
          ctx.lineWidth = 3.5;
          ctx.stroke();

          // Vignette
          const shine = ctx.createRadialGradient(width * 0.35, height * 0.28, 0, width * 0.35, height * 0.28, scale * 0.95);
          shine.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
          shine.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.beginPath();
          path({type: 'Sphere'});
          ctx.fillStyle = shine;
          ctx.fill();
          ctx.restore();
        }

        render();

        let isDown = false, lastX = 0, lastY = 0;
        canvas.addEventListener('pointerdown', e => {
          isDown = true;
          lastX = e.clientX; lastY = e.clientY;
          canvas.classList.add('dragging');
        });
        window.addEventListener('pointermove', e => {
          if (!isDown) return;
          const dx = e.clientX - lastX;
          const dy = e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          const r = projection.rotate();
          const k = 75 / projection.scale();
          projection.rotate([r[0] + dx * k, Math.max(-85, Math.min(85, r[1] - dy * k)), 0]);
          render();
        });
        window.addEventListener('pointerup', () => { isDown = false; canvas.classList.remove('dragging'); });
      });
  </script>
</body>
</html>
